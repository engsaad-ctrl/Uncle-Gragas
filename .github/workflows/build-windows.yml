name: build-windows
on:
  push:
    branches: [claude/sleepy-cerf-xyrs3s, main]
  workflow_dispatch:
permissions:
  contents: write # publishes each build as a GitHub release; the installed app updates itself from the latest one
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx -y npm@11 ci
      - run: npm test
      # Every build gets a higher version, so installed copies see it as an update.
      - run: npm version 0.1.${{ github.run_number }} --no-git-tag-version
      - run: npm run dist:win
      # One release per build, made here in one call: electron-builder's own publishing ran two uploaders that raced
      # to create the same release (duplicate releases, one missing latest.yml, which the installed app reads).
      - run: gh release create "v$env:V" --title "Uncle Gragas $env:V" --notes "Build ${{ github.sha }}" --target ${{ github.sha }} release/latest.yml "release/Uncle-Gragas-Setup-$env:V.exe" "release/Uncle-Gragas-Setup-$env:V.exe.blockmap"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: 0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Uncle-Gragas-windows
          path: release/*.exe
          if-no-files-found: error
