<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://raw.communitydragon.org; style-src 'self'; script-src 'self'">
  <title>Uncle Gragas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="side" class="side">
    <div class="brand"><img src="icon.png" alt=""><span class="name">Uncle<span> Gragas</span></span></div>
    <nav id="menu" class="menu" aria-label="القائمة الرئيسية">
      <a href="#/champions" data-tab="champions" aria-label="الأبطال">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C7 2 4 5.6 4 10v5l3 3v4h3v-6l-3-2.5V11h4.5V9h-1V5.4c.5-.1 1-.2 1.5-.2s1 .1 1.5.2V9h-1v2H17v2.5L14 16v6h3v-4l3-3v-5c0-4.4-3-8-8-8z"/></svg>
        <span>الأبطال</span>
      </a>
      <a href="#/items" data-tab="items" aria-label="الأيتمات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 19.5 10.5 12 18 6 12 13.5 4.5z"/><path d="M4.4 12.6l1.4-1.4 7 7-1.4 1.4z"/><path d="M8 14.2l1.4 1.4-5 5L3 19.2z"/></svg>
        <span>الأيتمات</span>
      </a>
      <a href="#/augments" data-tab="augments" aria-label="التعزيزات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2l8.7 5v10L12 22l-8.7-5V7zM12 6.5 7.2 9.3v5.4l4.8 2.8 4.8-2.8V9.3z"/><path d="M12 9l2.6 3-2.6 3-2.6-3z"/></svg>
        <span>التعزيزات</span>
      </a>
      <a href="#/tierlist" data-tab="tierlist" aria-label="Tier List">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 10h6v11H9zM2.5 14H8v7H2.5zM16 17h5.5v4H16zM12 2l1.2 2.5 2.8.4-2 1.9.5 2.7-2.5-1.3-2.5 1.3.5-2.7-2-1.9 2.8-.4z"/></svg>
        <span>Tier List</span>
      </a>
      <a href="#/profile" data-tab="profile" aria-label="حسابي">
        <img id="account-icon" alt="" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5zM12 6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM7.5 16.5c1.2 1.4 2.8 2.4 4.5 3 1.7-.6 3.3-1.6 4.5-3-.6-2.3-2.4-3.5-4.5-3.5s-3.9 1.2-4.5 3.5z"/></svg>
        <span>حسابي</span>
      </a>
    </nav>
    <div class="menu-title"><span>الأطوار</span></div>
    <nav id="modes" class="menu modes" aria-label="الأطوار">
      <button type="button" data-mode="normal" aria-label="Summoner's Rift">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17V5a2 2 0 0 1 2-2h12v2.5H5.5V17zM21 7v12a2 2 0 0 1-2 2H7v-2.5h11.5V7zM7.5 14.7l7.2-7.2 1.8 1.8-7.2 7.2z"/><circle cx="5" cy="19" r="2.8"/><circle cx="19" cy="5" r="2.8"/></svg>
        <span>Summoner's Rift</span>
      </button>
      <button type="button" data-mode="aram" aria-label="ARAM">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 3l10 18H2zM12 7.2l-3 5.4 1.8-1 1.2 1.6 1.2-1.6 1.8 1z"/></svg>
        <span>ARAM</span>
      </button>
      <button type="button" data-mode="mayhem" aria-label="ARAM Mayhem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M13 2c.6 3.5 5.9 6 5.9 12.2A6.9 6.9 0 0 1 12 21.5a6.9 6.9 0 0 1-6.9-7.3c0-3 1.6-5 3.2-6.4.2 2 .9 3.3 2.2 3.8C10 8 10.8 4.6 13 2zM12 13c-1.8 1.7-2.6 3-2.6 4.3a2.6 2.6 0 0 0 5.2 0c0-1.3-.8-2.6-2.6-4.3z"/></svg>
        <span>ARAM Mayhem</span>
      </button>
      <button type="button" data-mode="arena" aria-label="Arena">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3v3.5L9.8 17.7l-3.5-3.5L17.5 3z"/><path d="M3 3h3.5l11.2 11.2-3.5 3.5L3 6.5z"/><path d="M4.4 13.4l1.4-1.4 6.2 6.2-1.4 1.4z"/><path d="M6.6 16 8 17.4l-3.5 3.5-1.4-1.4z"/><path d="M19.6 13.4 18.2 12 12 18.2l1.4 1.4z"/><path d="M17.4 16 16 17.4l3.5 3.5 1.4-1.4z"/></svg>
        <span>Arena</span>
      </button>
    </nav>
    <div class="side-foot">
      <div id="lcu-status" class="lcu-status" role="status"><b class="dot"></b><span>جاري البحث عن اللعبة…</span></div>
      <button type="button" id="update-btn" class="settings-btn update-btn" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3h3v8h4L12 17l-5.5-6h4zM4 18.5h16V21H4z"/></svg>
        <span>تحديث جاهز: أعد التشغيل</span>
      </button>
      <button type="button" id="settings-btn" class="settings-btn" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M10.3 2h3.4l.5 2.7c.6.2 1.2.5 1.7.8l2.3-1.6 2.4 2.4-1.6 2.3c.3.5.6 1.1.8 1.7l2.7.5v3.4l-2.7.5c-.2.6-.5 1.2-.8 1.7l1.6 2.3-2.4 2.4-2.3-1.6c-.5.3-1.1.6-1.7.8l-.5 2.7h-3.4l-.5-2.7c-.6-.2-1.2-.5-1.7-.8l-2.3 1.6-2.4-2.4 1.6-2.3c-.3-.5-.6-1.1-.8-1.7L2 13.7v-3.4l2.7-.5c.2-.6.5-1.2.8-1.7L3.9 5.8l2.4-2.4 2.3 1.6c.5-.3 1.1-.6 1.7-.8zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>
        <span>الإعدادات</span>
      </button>
    </div>
  </aside>
  <main id="view"></main>
  <div id="settings" class="settings-pop" hidden></div>
  <script type="module" src="../dist/renderer/app.js"></script>
</body>
</html>
