<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://raw.communitydragon.org; style-src 'self'; script-src 'self'">
  <title>LOL_helper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="side">
    <div class="brand"><img src="icon.png" alt=""><span class="name">LOL<span>_helper</span></span></div>
    <nav id="menu" class="menu" aria-label="القائمة الرئيسية">
      <a href="#/champions" data-tab="champions">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span>الأبطال</span>
      </a>
      <a href="#/items" data-tab="items">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3l7 7-9 9-7-7z"/><path d="M3 21l4-4"/></svg>
        <span>الأيتمات</span>
      </a>
      <a href="#/augments" data-tab="augments">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 8l2 4-2 4-2-4z"/></svg>
        <span>التعزيزات</span>
      </a>
      <a href="#/tierlist" data-tab="tierlist">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h6"/></svg>
        <span>Tier List</span>
      </a>
    </nav>
    <div class="menu-title">الأطوار</div>
    <nav id="modes" class="menu modes" aria-label="الأطوار">
      <button type="button" data-mode="normal"><b class="dot"></b><span>العادي</span><small>Summoner's Rift</small></button>
      <button type="button" data-mode="aram"><b class="dot"></b><span>ARAM</span></button>
      <button type="button" data-mode="mayhem"><b class="dot"></b><span>ARAM Mayhem</span></button>
      <button type="button" data-mode="arena"><b class="dot"></b><span>Arena</span></button>
    </nav>
    <div class="side-foot"><div id="lang"></div></div>
  </aside>
  <main id="view"></main>
  <script type="module" src="../dist/renderer/app.js"></script>
</body>
</html>
