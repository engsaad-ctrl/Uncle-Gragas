<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://raw.communitydragon.org; style-src 'self'; script-src 'self'">
  <title>Uncle Gragas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="overlay">
  <section class="ov-panel">
    <header class="ov-head">
      <img id="ov-champ" alt="">
      <div><strong id="ov-title">التعزيزات</strong><div id="ov-sub" class="en"></div></div>
      <button type="button" id="ov-size"></button>
      <button type="button" id="ov-close" aria-label="إغلاق (F7)">✕</button>
    </header>
    <nav id="ov-tabs" class="tabs ov-tabs" hidden>
      <button type="button" data-tab="build">البناء</button>
      <button type="button" data-tab="augments">التعزيزات</button>
    </nav>
    <div id="ov-build" class="ov-build" hidden></div>
    <div id="ov-aug" class="ov-aug">
      <label class="search"><input id="ov-search" type="search" placeholder="اكتب اسم التعزيز…" autocomplete="off"></label>
      <div id="ov-rarity" class="ov-rarity"></div>
      <div id="ov-ai-bar" class="ov-ai-bar" hidden></div>
      <div id="ov-list" class="ov-list"></div>
    </div>
    <p class="hint">F7 أو Esc للإخفاء · مرّر الماوس على أي أيقونة أو تعزيز لوصفه</p>
  </section>
  <script type="module" src="../dist/renderer/overlay.js"></script>
</body>
</html>
